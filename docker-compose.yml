# Freqtrade trading bot — core service definition.
#
# Security notes:
#   * The API port is published to 127.0.0.1 ONLY — never 0.0.0.0. (Inside the
#     container the API server itself listens on 0.0.0.0 so the published port
#     works; isolation comes from the host-side binding plus API auth.)
#   * restart: unless-stopped — the bot survives crashes/host reboots, but a
#     manual `docker compose stop` keeps it stopped (unlike restart: always).
#   * All secrets come from .env (git-ignored); see .env.example.
#     FREQTRADE__* variables override config values natively. NEVER set
#     FREQTRADE__DRY_RUN there — it would bypass the file-based safety gate.
#
# Safety gate: every start runs scripts/validate_config.py BEFORE the bot
# (mounted read-only below). The bot never launches if the gate refuses.
# freqtrade 2026.8 exits 0 even on config errors, so this pre-gate is what
# actually enforces dry-run on the start path.
#
# Ad-hoc one-off commands need an entrypoint override, e.g.:
#   docker compose run --rm --entrypoint freqtrade freqtrade show-config \
#     --config /freqtrade/user_data/config-dryrun.json

services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080" # Freqtrade REST API / FreqUI — localhost only
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./scripts:/freqtrade/scripts:ro
      - ./tests:/freqtrade/tests:ro
    # sh -c wrapper so the safety gate runs before the bot on EVERY start;
    # `exec` hands the PID to freqtrade so docker stop signals reach it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python3 /freqtrade/scripts/validate_config.py /freqtrade/user_data/config-dryrun.json && exec freqtrade trade --config /freqtrade/user_data/config-dryrun.json --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite --logfile /freqtrade/user_data/logs/freqtrade.log

  # Runtime risk enforcement (Phase 6): audits the trade DB read-only every
  # cycle against risk_guard's hardcoded caps and POSTs /api/v1/stop on
  # breach. The API URL targets the compose network (the bot's port is
  # published to 127.0.0.1 on the host only). Credentials come from .env
  # via env_file — same as the bot's.
  watchdog:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-watchdog
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - freqtrade
    environment:
      WATCHDOG_API_URL: http://freqtrade:8080
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./scripts:/freqtrade/scripts:ro
    entrypoint: ["python3", "/freqtrade/scripts/watchdog.py"]
